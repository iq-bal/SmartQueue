[General]
network = ned.AdaptivePriorityNetwork
sim-time-limit = 60s

# Random number generator settings
seed-set = ${repetition}
num-rngs = 3

# Router configuration
**.router.queueCapacity = 200
**.router.congestionThreshold = 0.7
**.router.recoveryThreshold = 0.5
**.router.checkInterval = 0.1s

# Client 0 - High priority voice traffic
**.client[0].packetType = "voice"
**.client[0].priorityLevel = 0
**.client[0].sendInterval = exponential(0.03s)

# Client 1 - Medium priority video traffic
**.client[1].packetType = "video"
**.client[1].priorityLevel = 1
**.client[1].sendInterval = exponential(0.02s)

# Client 2 - Low priority data traffic
**.client[2].packetType = "data"
**.client[2].priorityLevel = 2
**.client[2].sendInterval = exponential(0.01s)

# Statistics recording
**.scalar-recording = true
**.vector-recording = true
output-vector-file = results/adaptive_router.vec
output-scalar-file = results/adaptive_router.sca

# Detailed logging
cmdenv-express-mode = false
cmdenv-autoflush = true
cmdenv-event-banners = true

# Configuration for different traffic scenarios
[Config Light]
extends = General
description = "Light traffic scenario"
**.client[0].sendInterval = exponential(0.1s)
**.client[1].sendInterval = exponential(0.08s)
**.client[2].sendInterval = exponential(0.05s)
output-vector-file = results/light_traffic.vec
output-scalar-file = results/light_traffic.sca

[Config Heavy]
extends = General
description = "Heavy traffic scenario"
**.client[0].sendInterval = exponential(0.01s)
**.client[1].sendInterval = exponential(0.008s)
**.client[2].sendInterval = exponential(0.005s)
output-vector-file = results/heavy_traffic.vec
output-scalar-file = results/heavy_traffic.sca

[Config Mixed]
extends = General
description = "Mixed traffic scenario with varying loads"
**.client[0].sendInterval = exponential(0.02s)
**.client[1].sendInterval = exponential(0.015s)
**.client[2].sendInterval = exponential(0.008s)
output-vector-file = results/mixed_traffic.vec
output-scalar-file = results/mixed_traffic.sca

[Config Congestion]
extends = General
description = "Congestion test scenario"
**.router.queueCapacity = 50
**.client[0].sendInterval = exponential(0.005s)
**.client[1].sendInterval = exponential(0.004s)
**.client[2].sendInterval = exponential(0.003s)
output-vector-file = results/congestion_test.vec
output-scalar-file = results/congestion_test.sca